<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="google-maps-mcp  share link to canonical maps URL">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15202b"/>
      <stop offset="55%" stop-color="#1c2a38"/>
      <stop offset="100%" stop-color="#243746"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#e8a317"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4f60"/>
      <stop offset="100%" stop-color="#2a3a48"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5f7386"/>
      <stop offset="50%" stop-color="#a8bbc9"/>
      <stop offset="100%" stop-color="#5f7386"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="58%" r="32%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fa3b4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="280" cy="250" rx="260" ry="150" fill="url(#glow)"/>

  <!-- Wordmark -->
  <g transform="translate(120,28)">
    <text x="0" y="42" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" font-weight="700" letter-spacing="-1">google-maps-mcp</text>
    <text x="2" y="68" fill="#e8a317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2">SHARE LINK ’ CANONICAL · STDIO</text>
  </g>

  <!-- Map pin -->
  <g transform="translate(168,150)" filter="url(#soft)">
    <path d="M72 8 C40 8 16 34 16 68 C16 112 72 168 72 168 C72 168 128 112 128 68 C128 34 104 8 72 8 Z" fill="url(#pin)"/>
    <circle cx="72" cy="68" r="22" fill="#15202b"/>
    <circle cx="72" cy="68" r="10" fill="#f4f7fa"/>
  </g>

  <!-- Flow rail -->
  <g filter="url(#soft)">
    <rect x="380" y="248" width="780" height="14" rx="4" fill="url(#rail)"/>
    <rect x="392" y="251" width="756" height="4" rx="2" fill="#eef4f8" opacity="0.45"/>
  </g>

  <!-- Share ’ canonical cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" filter="url(#soft)">
    <g transform="translate(400,198)">
      <rect width="280" height="64" rx="6" fill="url(#card)" stroke="#6f8799"/>
      <text x="16" y="26" fill="#6f8799" font-size="11">share</text>
      <text x="16" y="48" fill="#c9d7e3" font-size="14" font-weight="700">maps.app.goo.gl/xxxx</text>
    </g>
    <g transform="translate(700,214)">
      <polygon points="0,12 22,0 22,24" fill="#f0b429"/>
    </g>
    <g transform="translate(740,190)">
      <rect width="400" height="80" rx="6" fill="#3f5870" stroke="#f0b429" stroke-width="2"/>
      <text x="16" y="28" fill="#e8a317" font-size="11">canonical</text>
      <text x="16" y="52" fill="#f4f7fa" font-size="15" font-weight="700">google.com/maps/place/&</text>
    </g>
  </g>

  <!-- Tool chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">
    <g transform="translate(400,338)">
      <rect width="148" height="28" rx="6" fill="#3f5870" stroke="#f0b429"/>
      <text x="74" y="19" text-anchor="middle" fill="#f4f7fa">link_resolve</text>
    </g>
    <g transform="translate(560,338)">
      <rect width="160" height="28" rx="6" fill="#3f5870" stroke="#f0b429"/>
      <text x="80" y="19" text-anchor="middle" fill="#f4f7fa">place_resolve</text>
    </g>
    <g transform="translate(732,338)">
      <rect width="128" height="28" rx="6" fill="#3f5870" stroke="#f0b429"/>
      <text x="64" y="19" text-anchor="middle" fill="#f4f7fa">route_eta</text>
    </g>
    <g transform="translate(872,338)">
      <rect width="88" height="28" rx="6" fill="#3a4f60" stroke="#6f8799"/>
      <text x="44" y="19" text-anchor="middle" fill="#c9d7e3">no key</text>
    </g>
  </g>
</svg>
